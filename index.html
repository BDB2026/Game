<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>Memoria Cóndor</title><style>*{box-sizing:border-box}body{margin:0;padding:6px;background:#06162d;color:#fff;font-family:Segoe UI,Arial}.app{max-width:1260px;margin:auto;background:#10233a;border-radius:18px;overflow:hidden}header{padding:12px;background:#00317f;border-bottom:6px solid #f9b818;display:flex;justify-content:space-between;gap:8px;align-items:center}.area{color:#ffd100;font-weight:800}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions>*{border:0;border-radius:9px;padding:9px;font-weight:900}.timer{background:#07182c;color:#ffd100;border:2px solid #f9b818}.actions button{background:#ffffff18;color:white}.screen{display:none}.on{display:block}.start{min-height:600px;display:grid;grid-template-columns:1fr 1fr}.intro,.setup{padding:30px;display:flex;flex-direction:column;justify-content:center}.setup{background:linear-gradient(145deg,#0851bb,#00255d)}.rule{background:#ffffff0d;padding:10px;border-radius:10px;margin:4px}.setup input,.setup select,.primary{font:inherit;border:0;border-radius:10px;padding:12px;margin:5px}.primary{background:#f9b818;color:#082040;font-weight:900}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.player{padding:8px;background:#ffffff0b;border:4px solid transparent;border-radius:12px;text-align:center}.player.active{border-color:#f9b818}.player b{display:block;color:#f9b818;font-size:22px}.game{padding:14px}.info,.message{padding:10px;margin:9px 0;background:#07182c;border-radius:10px;font-weight:900}.info{display:flex;justify-content:space-between}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.card{height:110px;border:0;background:none;padding:0;perspective:800px}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.4s}.open .inner,.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden}.back{background:#00317f;border:3px solid #ffffff25;color:#f9b818;font-size:24px;font-weight:900}.front{transform:rotateY(180deg);background:#fff;border:3px solid #f9b818;font-size:40px}.matched .front{background:#dcf5e8}.penalty .front{color:#8a1423;font-size:14px;text-align:center}.modal{display:none;position:fixed;inset:0;background:#001127e8;z-index:20;place-items:center;padding:12px}.modal.on{display:grid}.quiz{width:min(800px,100%);max-height:94vh;overflow:auto;background:#fff;color:#10233e;padding:20px;border-radius:18px}.question{font-size:20px;background:#edf4fc;padding:14px;border-radius:11px;font-weight:800}.opts{display:grid;gap:8px;margin-top:10px}.opts.hidden{display:none}.opt{padding:12px;text-align:left;border:2px solid #b7c9df;border-radius:10px;background:#f8fafc;font-weight:800}.feedback{padding:12px;margin-top:10px;border-radius:10px;font-weight:800}.good{background:#dff6e9;color:#0c6039}.bad{background:#ffe3e7;color:#8a1423}.end{min-height:600px;padding:30px;text-align:center}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.place{background:#ffffff10;padding:16px;border-radius:12px}.round-status{padding:10px;margin:8px 0;background:#ffffff12;border-radius:10px}.round-status.done{border-left:5px solid #31c46c}.trap .front{background:#ffe3e7;border-color:#d62839;font-size:38px}.access-error{color:#ffe59a;font-weight:800;min-height:24px}.primary:disabled,select option:disabled{opacity:.55}@media(max-width:850px){.start{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,1fr)}}@media(max-width:620px){header{flex-direction:column;align-items:stretch}.actions{display:grid;grid-template-columns:repeat(4,1fr)}.intro,.setup{padding:18px}.game{padding:7px}.board{gap:5px}.card{height:82px}.players{gap:4px}.player{font-size:12px;padding:5px}.podium{grid-template-columns:1fr}}</style></head><body><main class="app"><header><div><b><img src="data:image/png;base ss="game"><div id="players" class="players"></div><div class="info"><span id="ri"></span><span id="pi"></span><span id="ti"></span></div><div id="board" class="board"></div><div id="msg" class="message"></div></div></section><section id="end" class="screen"><div class="end"><h1>🏆 Partida finalizada</h1><div id="podium" class="podium"></div><button id="homeBtn" class="primary">🏠 Ir al inicio y elegir otra ronda</button></div></section></main><div id="modal" class="modal"><div class="quiz"><div id="question" class="question"></div><div id="opts" class="opts"></div><div id="feedback"></div></div></div><script>const Q=[{"round":1,"n":1,"emoji":"✈️","q":"¿Qué ocurre si no es posible entregar la tarjeta débito en el primer intento?","options":["La tarjeta es cancelada.","El cliente recibirá información para actualizar datos o conocer dónde reclamarla.","Debe solicitar una nueva tarjeta."],"correct":1,"clar":"La respuesta correcta es El cliente recibirá información para actualizar datos o conocer dónde reclamarla."},{"round":1,"n":2,"emoji":"📅","q":"¿Qué beneficio tiene la primera solicitud de chequera posterior a la migración?","options":["Incluye una ampliación del cupo.","No tiene costo para el cliente.","Incluye nuevos firmantes automáticamente."],"correct":1,"clar":"La respuesta correcta es No tiene costo para el cliente."},{"round":1,"n":3,"emoji":"🗓️","q":"¿Cómo serán entregadas las nuevas chequeras?","options":["A través de las oficinas del Banco de Bogotá.","Exclusivamente por mensajería especializada.","Únicamente mediante solicitud digital."],"correct":0,"clar":"La respuesta correcta es A través de las oficinas del Banco de Bogotá."},{"round":1,"n":4,"emoji":"🏁","q":"¿Cuál fue el segmento con mayor crecimiento relativo de clientes?","options":["Premium.","Preferente.","Consumo."],"correct":0,"clar":"La respuesta correcta es Premium."},{"round":1,"n":5,"emoji":"📱","q":"¿Qué aspecto regulan las firmas y condiciones de manejo?","options":["Las tasas de interés de los productos.","Los cupos de crédito aprobados.","Las reglas para el manejo de los productos y la disposición de los recursos."],"correct":2,"clar":"La respuesta correcta es Las reglas para el manejo de los productos y la disposición de los recursos."},{"round":1,"n":6,"emoji":"🎧","q":"¿Qué sucede con las firmas y condiciones de manejo de las cuentas Itaú durante la migración?","options":["Se eliminan automáticamente.","Se migran automáticamente a las nuevas cuentas Banco de Bogotá.","Deben registrarse nuevamente por todos los clientes."],"correct":1,"clar":"La respuesta correcta es Se migran automáticamente a las nuevas cuentas Banco de Bogotá."},{"round":1,"n":7,"emoji":"📉","q":"¿Qué puede hacer el cliente si desea actualizar sus firmas y condiciones de manejo?","options":["Solicitar el cambio en cualquier oficina del Banco.","Esperar la siguiente renovación del producto.","Solicitar el cambio únicamente por Call Center."],"correct":0,"clar":"La respuesta correcta es Solicitar el cambio en cualquier oficina del Banco."},{"round":1,"n":8,"emoji":"🛟","q":"¿Cuántos clientes nuevos representó la migración?","options":["35 mil clientes.","203 mil clientes.","267 mil clientes."],"correct":2,"clar":"La respuesta correcta es 267 mil clientes."},{"round":1,"n":9,"emoji":"🟧","q":"¿Por cuánto tiempo tendrán exoneración de cuota de manejo las tarjetas de crédito amparadas migradas de Itaú?","options":["Solo si la tarjeta migrada es LATAM Pass tendrán exoneración por 6 meses.","La tarjeta amparada tendrá exoneración por tiempo indefinido, siempre que conserve el producto asignado y sea activada a más tardar el 24 de octubre de 2026.","Por 1 año."],"correct":1,"clar":"La respuesta correcta es La tarjeta amparada tendrá exoneración por tiempo indefinido, siempre que conserve el producto asignado y sea activada a más tardar el 24 de octubre de 2026."},{"round":1,"n":10,"emoji":"💳","q":"¿Las cuentas migradas de Itaú conservaron las condiciones de manejo anteriores a la migración?","options":["FALSO.","Las cuentas migradas no necesitan condiciones de manejo porque son clientes digitales.","VERDADERO."],"correct":2,"clar":"La respuesta correcta es VERDADERO."},{"round":1,"n":11,"emoji":"🔎","q":"¿Qué debo hacer con cuentas Itaú migradas como cuentas conjuntas cuando debían conservar titularidad individual o alterna?","options":["Radicar una solicitud de cambio de titularidad mediante la Power App de Radicación de Operaciones de Productos y Servicios Cash.","El cliente debe dirigirse a una oficina.","El cliente debe radicar la novedad por Servilínea."],"correct":0,"clar":"La respuesta correcta es Radicar una solicitud de cambio de titularidad mediante la Power App de Radicación de Operaciones de Productos y Servicios Cash."},{"round":1,"n":12,"emoji":"📦","q":"¿Cómo se llama la Directora de la Dirección Operativa de Procesos Front?","options":["Diana Mendieta.","Diana Domínguez.","Diana González."],"correct":1,"clar":"La respuesta correcta es Diana Domínguez."},{"round":2,"n":1,"emoji":"✈️","q":"¿Cómo se llama la Gerente de la Gerencia de Gestión Operativa de Canales de Atención?","options":["Carolina Duarte.","Carolina León.","Carolina Domínguez."],"correct":0,"clar":"La respuesta correcta es Carolina Duarte."},{"round":2,"n":2,"emoji":"📅","q":"¿Cómo se llama el líder operativo de la Región Antioquia?","options":["Gustavo Macias.","Miguel Casquete.","Elver Ortega."],"correct":0,"clar":"La respuesta correcta es Gustavo Macias."},{"round":2,"n":3,"emoji":"🗓️","q":"En la apertura de una cuenta corriente o de ahorros para una unión temporal o consorcio, ¿qué es posible realizar respecto a la tarjeta débito?","options":["No es posible asignarla porque no corresponde a una persona natural ni jurídica.","Asignarla si los integrantes firman la declaración juramentada ETD_FOR_033, autorizan a una persona para solicitar, tramitar y recibir la tarjeta y se comprometen sobre el manejo de los recursos, siempre que no se administren recursos públicos.","Asignarla sin restricciones porque el representante legal tiene plenas facultades."],"correct":1,"clar":"La respuesta correcta es Asignarla si los integrantes firman la declaración juramentada ETD_FOR_033, autorizan a una persona para solicitar, tramitar y recibir la tarjeta y se comprometen sobre el manejo de los recursos, siempre que no se administren recursos públicos."},{"round":2,"n":4,"emoji":"🏁","q":"¿Cuál situación no requiere obligatoriamente el registro y la visación de firmas?","options":["Apertura de CDT con titularidad plural.","Apertura de cuenta con titularidad plural.","Apertura de encargos fiduciarios con titularidad unipersonal."],"correct":2,"clar":"La respuesta correcta es Apertura de encargos fiduciarios con titularidad unipersonal."},{"round":2,"n":5,"emoji":"📱","q":"¿Cuánto crecimiento en cartera de Consumo aportó la migración?","options":["$2.1 billones.","$4.1 billones.","$3.3 billones."],"correct":2,"clar":"La respuesta correcta es $3.3 billones."},{"round":2,"n":6,"emoji":"🎧","q":"¿Qué consecuencia puede tener rediferir la deuda después de la migración?","options":["El producto pierde las tasas preferenciales asignadas en la migración.","La deuda se elimina temporalmente de la Banca Móvil.","El número de la tarjeta cambia automáticamente."],"correct":0,"clar":"La respuesta correcta es El producto pierde las tasas preferenciales asignadas en la migración."},{"round":2,"n":7,"emoji":"📉","q":"¿Qué debe hacer el cliente con la tarjeta Itaú después de activar la nueva tarjeta Banco de Bogotá?","options":["Destruir la tarjeta antigua y no entregar el plástico a ninguna persona.","Conservarla activa como tarjeta de respaldo hasta su vencimiento.","Entregarla a un tercero para llevarla a una oficina."],"correct":0,"clar":"La respuesta correcta es Destruir la tarjeta antigua y no entregar el plástico a ninguna persona."},{"round":2,"n":8,"emoji":"🛟","q":"¿Qué conceptos de la consolidación se trasladan con tasa del 0%?","options":["Únicamente compras internacionales y avances diferidos.","Todas las compras vigentes.","Compras y avances a una cuota, comisiones y seguros, intereses y compras a tasa cero."],"correct":2,"clar":"La respuesta correcta es Compras y avances a una cuota, comisiones y seguros, intereses y compras a tasa cero."},{"round":2,"n":9,"emoji":"🟧","q":"¿Cómo se consulta en OnBase el documento detallado de consolidación?","options":["Buscando “EXTRACTO MENSUAL TC” solo con el número de tarjeta.","Buscando “CT – REPORTE CONSOLIDACIÓN DE DEUDA TC ITAÚ” con tipo y número de documento.","Consultando “HISTÓRICO DE PAGOS” con el número de obligación."],"correct":1,"clar":"La respuesta correcta es Buscando “CT – REPORTE CONSOLIDACIÓN DE DEUDA TC ITAÚ” con tipo y número de documento."},{"round":2,"n":10,"emoji":"💳","q":"¿Qué sucede inicialmente con la visualización de la nueva tarjeta mientras se consolida la deuda?","options":["No aparece en ningún canal.","Puede aparecer sin deuda.","Aparece cancelada."],"correct":1,"clar":"La respuesta correcta es Puede aparecer sin deuda."},{"round":2,"n":11,"emoji":"🔎","q":"¿Qué debo hacer si la tarjeta de crédito no aparece activa y en Data IN figura como entregada?","options":["Reportar a los dueños del tablero.","Validar con el cliente si reconoce la dirección de entrega.","Escalar con el área de tarjetas."],"correct":1,"clar":"La respuesta correcta es Validar con el cliente si reconoce la dirección de entrega."},{"round":2,"n":12,"emoji":"📦","q":"Ana Rodríguez solicita el levantamiento de la hipoteca de un crédito originalmente de Itaú. ¿Qué debe verificar el asesor?","options":["Que el crédito haya migrado y la garantía hipotecaria esté asociada a la obligación en Sistema Control de Garantía.","Que el crédito migrado no tenga garantía hipotecaria.","Esperar aprobación jurídica."],"correct":0,"clar":"La respuesta correcta es Que el crédito haya migrado y la garantía hipotecaria esté asociada a la obligación en Sistema Control de Garantía."},{"round":3,"n":1,"emoji":"✈️","q":"Marcela Gómez tiene un Leasing Habitacional migrado y requiere levantar la garantía. Después de validar en PPE, ¿a qué correo debe remitir el requerimiento?","options":["levantamientoprendaehipoteca@bancodebogota.com.co","administracion.leasing@itau.co","bbdleasingGCC@bancodebogota.com.co"],"correct":2,"clar":"La respuesta correcta es bbdleasingGCC@bancodebogota.com.co"},{"round":3,"n":2,"emoji":"📅","q":"Un cliente migrado solicita chequeras gratuitas. Tras validar PPE y Canales Sofía, ¿qué criterio aplica?","options":["Entregar las tres solicitadas.","Entregar dos para evitar reclamación.","Entregar únicamente la cantidad definida en el listado oficial."],"correct":2,"clar":"La respuesta correcta es Entregar únicamente la cantidad definida en el listado oficial."},{"round":3,"n":3,"emoji":"🗓️","q":"¿Cuándo se completará la migración de clientes y la consolidación de saldos asociados?","options":["25 de diciembre de 2026.","25 de octubre de 2026.","25 de noviembre de 2026."],"correct":1,"clar":"La respuesta correcta es 25 de octubre de 2026."},{"round":3,"n":4,"emoji":"🏁","q":"¿Por cuál canal los clientes no recibirán comunicación con la explicación de la consolidación?","options":["Correo electrónico con PDF.","WhatsApp con video.","Mensaje de texto."],"correct":2,"clar":"La respuesta correcta es Mensaje de texto."},{"round":3,"n":5,"emoji":"📱","q":"¿Por cuáles canales podrán consultar la consolidación de su deuda de tarjeta Itaú?","options":["Banca Móvil.","Oficinas.","Todas las anteriores."],"correct":2,"clar":"La respuesta correcta es Todas las anteriores."},{"round":3,"n":6,"emoji":"🎧","q":"¿Qué hacer si los valores consolidados no coinciden con la deuda del último extracto?","options":["Escalar en SAC bajo Cóndor, Aclaraciones, Ajustes y novedades de producto CR, TC.","Modificar manualmente el Saldo Diferido.","Solicitar el pago de la diferencia."],"correct":0,"clar":"La respuesta correcta es Escalar en SAC bajo Cóndor, Aclaraciones, Ajustes y noveda const THEMES={1:['😍','😎','🤩','🥳','😴','🤔','😱','😭','😡','🤢','🥶','🥵'],2:['🦁','🐯','🐘','🦒','🦓','🐼','🐨','🦊','🐶','🐱','🐵','🐸'],3:['😀','😃','😄','😁','😆','😅','😂','🤣','🙂','😊','😉','😇'],4:['🌎','🌍','🌏','🍊','🍋','🍐','🗺️','🧳','📸','📷','🛫','🛬']};
const ROUND_NAMES={1:'Emojis',2:'Animales',3:'Caras',4:'Buena memoria'};
const ROUND_KEYS={1:'151',2:'223',3:'455',4:'599'};
const $=x=>document.getElementById(x);
let player={name:'Participante',score:0},completed={},roundScores={},roundBonuses={};
let r=1,C=[],one=null,two=null,pend=null,lock=false,pairs=0,traps=0,timer,left=900,done=false,z=1,sound=true,roundStartScore=0,audioCtx=null;
function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(x).classList.add('on')}
function zm(d){z=Math.min(1.3,Math.max(.7,z+d));document.documentElement.style.zoom=z}
function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur=.1,type='sine',vol=.08,delay=0){if(!sound)return;const a=audio(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const sfx={flip(){tone(420,.06,'sine',.035)},correct(){tone(660,.12,'sine',.08);tone(880,.18,'sine',.08,.12)},wrong(){tone(210,.18,'sawtooth',.055);tone(160,.22,'sawtooth',.05,.16)},trap(){tone(150,.12,'square',.045);tone(110,.25,'square',.05,.13)},finish(){tone(523,.12,'sine',.07);tone(659,.12,'sine',.07,.13);tone(784,.28,'sine',.08,.26)}};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';if(sound){audio();tone(600,.08,'sine',.05)}};
function tick(){let m=Math.floor(left/60),s=left%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function startTimer(){clearInterval(timer);left=900;tick();timer=setInterval(()=>{left--;tick();if(left<=0)finish('time')},1000)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setAccessError(t){let e=$('accessError');if(!e){e=document.createElement('div');e.id='accessError';e.className='access-error';$('accessKey').insertAdjacentElement('afterend',e)}e.textContent=t}
function updateRoundSelector(){const sel=$('round');[...sel.options].forEach(o=>{const n=+o.value;o.disabled=!!completed[n];o.textContent=`Ronda ${n} · ${ROUND_NAMES[n]}${completed[n]?' · ✅ Completada':''}`});const pending=[1,2,3,4].find(n=>!completed[n]);if(pending)sel.value=String(pending);$('begin').disabled=!pending;$('begin').textContent=pending?'▶ Iniciar ronda':'🏆 Todas las rondas completadas';$('accessKey').value='';setAccessError('')}
$('round').onchange=()=>{$('accessKey').value='';setAccessError('')};$('accessKey').addEventListener('keydown',e=>{if(e.key==='Enter')$('begin').click()});
$('begin').onclick=()=>{audio();const chosen=+$('round').value;if(completed[chosen])return;if($('accessKey').value.trim()!==ROUND_KEYS[chosen]){sfx.wrong();setAccessError('🔐 Clave incorrecta para la ronda seleccionada.');$('accessKey').focus();return}setAccessError('');player.name=$('p0').value.trim()||'Participante';r=chosen;roundStartScore=player.score;show('game');start();startTimer()};
function start(){done=lock=false;pairs=traps=0;one=two=pend=null;C=[];Q.filter(x=>x.round===r).forEach((x,index)=>{const emoji=THEMES[r][index];C.push({id:x.n,e:emoji},{id:x.n,e:emoji})});for(let i=0;i<4;i++)C.push({trap:true,id:'trap'+i,e:'⚠️'});shuffle(C);render();players();info();$('msg').textContent='Encuentra las 12 parejas. Cada Trampa resta 5 puntos y vuelve a ocultarse.'}
function render(){$('board').innerHTML=C.map((c,i)=>`<button class="card ${c.trap?'trap':''}" data-i="${i}"><div class="inner"><div class="face back">${i+1}</div><div class="face front">${c.e}</div></div></button>`).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>pick(b,+b.dataset.i))}
function players(){$('players').innerHTML=`<div class="player active">${player.name}<b>${player.score} puntos</b></div>`}
function info(){$('ri').textContent=`Ronda ${r}/4 · ${ROUND_NAMES[r]}`;$('pi').textContent=`Parejas ${pairs}/12 · Trampas activadas ${traps}`;$('ti').textContent=`Puntaje acumulado: ${player.score}`}
function pick(b,i){if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;sfx.flip();b.classList.add('open');if(C[i].trap){lock=true;player.score-=5;traps++;sfx.trap();players();info();$('question').textContent='⚠️ TRAMPA';$('opts').innerHTML='';$('opts').classList.add('hidden');$('feedback').className='feedback bad';$('feedback').textContent='−5 puntos';$('modal').classList.add('on');setTimeout(()=>{$('modal').classList.remove('on');$('opts').classList.remove('hidden');b.classList.remove('open');if(one){one.b.classList.remove('open');one=null}lock=false},1000);return}if(!one){one={b,c:C[i]};return}two={b,c:C[i]};lock=true;if(one.c.id===two.c.id){pend={one,two,q:Q.find(x=>x.round===r&&x.n===one.c.id)};setTimeout(quiz,300)}else setTimeout(()=>{one.b.classList.remove('open');two.b.classList.remove('open');one=two=null;lock=false},1000)}
function quiz(){$('question').textContent=pend.q.q;$('opts').classList.remove('hidden');$('opts').innerHTML=pend.q.options.map((x,i)=>`<button class="opt" onclick="answer(${i})"><b>${'ABC'[i]}.</b> ${x}</button>`).join('');$('feedback').className='';$('feedback').textContent='';$('modal').classList.add('on')}
function answer(i){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(i===pend.q.correct){sfx.correct();player.score+=100;pairs++;pend.one.b.classList.add('matched');pend.two.b.classList.add('matched');fb('good','✅ Correcto. +100 puntos.');players();info();setTimeout(()=>{close();one=two=pend=null;lock=false;if(pairs===12)finish('pairs')},1800)}else{sfx.wrong();$('opts').classList.add('hidden');fb('bad','❌ Respuesta incorrecta. La pareja vuelve a ocultarse.');setTimeout(()=>{let p=pend;close();p.one.b.classList.remove('open');p.two.b.classList.remove('open');one=two=pend=null;lock=false},2500)}}
function fb(c,t){$('feedback').className='feedback '+c;$('feedback').textContent=t}function close(){$('modal').classList.remove('on');$('opts').classList.remove('hidden')}
function finish(reason){if(done)return;done=lock=true;clearInterval(timer);close();sfx.finish();let bonus=0;if(reason==='pairs'&&left>0){bonus=left;player.score+=bonus}completed[r]=true;roundBonuses[r]=bonus;roundScores[r]=player.score-roundStartScore;show('end');document.querySelector('#end h1').textContent=reason==='time'?'⏰ Tiempo de la ronda finalizado':'🏆 Tablero completado';const detail=[1,2,3,4].filter(n=>completed[n]).map(n=>`<div class="round-status done">✅ Ronda ${n} · ${ROUND_NAMES[n]}: <b>${roundScores[n]} puntos</b>${roundBonuses[n]?`<br>⏱️ Bono por tiempo: +${roundBonuses[n]} puntos`:''}</div>`).join('');$('podium').innerHTML=`<div class="place" style="grid-column:1/-1"><h2>⭐ ${player.name}</h2><b>${player.score} puntos acumulados</b>${detail}<p>${Object.keys(completed).length}/4 rondas completadas</p></div>`;$('homeBtn').textContent=Object.keys(completed).length===4?'🏠 Ver resumen en el inicio':'🏠 Ir al inicio y elegir otra ronda'}
function goHome(){clearInterval(timer);close();show('start');$('p0').value=player.name;updateRoundSelector();const n=Object.keys(completed).length;document.querySelector('.intro h1').textContent=n===4?'🏆 Juego completado':'🧠 Memoria Cóndor';if(n===4)document.querySelector('.intro .rule').textContent=`✅ ${player.name} completó las 4 rondas con ${player.score} puntos acumulados.`}
$('homeBtn').onclick=goHome;updateRoundSelector();tick();
</script></body></html>
